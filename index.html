
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturate | Gestión de productos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>FACTURATE</h1>
        <p>Gestión de productos</p>
    </header>

    <main>
        <section>
            <h2>Registrar producto</h2>

            <label for="nombreProducto">Nombre del producto</label>
            <input type="text" id="nombreProducto" placeholder="Ej. Mouse inalámbrico">

            <label for="categoriaProducto">Categoría</label>
            <input type="text" id="categoriaProducto" placeholder="Ej. Periféricos">

            <label for="precioProducto">Precio</label>
            <input type="number" id="precioProducto" placeholder="Ej. 50000">

            <button id="btnAgregarProducto">Agregar producto</button>
        </section>

        <section>
            <h2>Productos registrados</h2>
            <ul id="listaProductos"></ul>
        </section>
    </main>

    <script src="main.js"></script>
</body>

</html>
